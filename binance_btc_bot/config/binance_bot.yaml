# Research-only selector definitions (LIVE_SELECTOR = null).
selectors:
  A:
    kind: ewma_7d
  B:
    kind: multi_horizon_ewma
  C:
    kind: regime_conditional
  D:
    kind: recent_plus_regime
  E:
    kind: rank_ewma
  F:
    kind: downside_aware

entry:
  mode: e2
  long_threshold: 0.65      # NEW CROSS into S >= 0.65
  # null = no upper band
  upper_threshold: null
  rule: NEW_CROSS
  late_entry_enabled: false

# Production score path — signed S via compute_all_factors → combined_score, E2 momentum.
signal:
  interval: 15m
  lookback_bars: 1000
  min_history_bars: 100
  momentum_profile: e2
  diagnostics: false
  max_closed_candle_age_sec: 1800
  signal_config_path: configs/signal_config.yaml

# Immutable daily archive under results/live_archive/YYYY-MM-DD/ (never overwrite).
archive:
  enabled: true
  root: results/live_archive

# Binance-native trailing exit mapping (documented; do not invent alternate geometry).
binance_trailing:
  mode: OCO_TAKE_PROFIT_TRAIL_PLUS_STOP_LOSS
  # above leg: TAKE_PROFIT SELL with activation stopPrice + trailingDelta (BIPS)
  # below leg: STOP_LOSS SELL at initial hard SL
  prefer_market_contingent: true
  limit_slippage_buffer_pct: 0.001  # only if LIMIT contingent types are forced

storage:
  sqlite_path: data/binance_btc_bot/bot.sqlite3

logging:
  level: INFO
  dir: binance_btc_bot/logs

# Notification policy — credentials are env-only (never stored here).
notifications:
  enabled: true
  telegram:
    enabled: true
  sms:
    enabled: true
  policy:
    INFO: [telegram]
    WARNING: [telegram]
    ERROR: [telegram]
    CRITICAL: [telegram, sms]

safety:
  initial_state: NORMAL
  halt_on_reconciliation_mismatch: true
  halt_on_duplicate_order: true
  halt_on_stale_data: true
  halt_on_api_failure: true

# Portfolio-level safety manager (independent of entry/W2 logic).
# Blocks NEW entries only; never changes the entry signal or normal W2 exits.
# Stop tightening below happens ONLY while DEFENSIVE_MODE is active.
# State persists in <sqlite dir>/safety_manager_state.json; only /restart clears it.
safety_manager:
  enabled: true
  # Circuit breaker: N exchange-confirmed stop-loss closures -> SAFETY_HALT.
  sl_halt_count: 2
  reset_counter_on_win: true      # trailing/TP exit resets the SL counter to 0
  sl_cooldown_minutes: 0          # optional pause after 1 SL (0 = disabled)
  # Defensive mode trigger: >= defensive_loss_count of defensive_min_open open positions <= defensive_loss_pct.
  defensive_min_open: 4
  defensive_loss_count: 3
  defensive_loss_pct: -0.020
  # Losing-position protection (DEFENSIVE MODE ONLY). Stop = max(current stop, price*(1-trail), entry*(1+hard)).
  loss_tighten_pct: -0.020
  loss_tighten_trail_pct: 0.010
  loss_strong_pct: -0.025
  loss_strong_trail_pct: 0.005
  loss_hard_exit_pct: -0.030      # at/below: market exit
  # Profit protection (DEFENSIVE MODE ONLY), based on peak P&L since tracking.
  profit_breakeven_pct: 0.010
  breakeven_offset_pct: 0.002     # stop = entry*(1+0.2%) covers round-trip fees
  profit_lock_pct: 0.015
  profit_lock_stop_pct: 0.0075    # stop = entry*(1+0.75%)
  profit_trail_pct: 0.020
  profit_trail_distance_pct: 0.010  # stop = peak*(1-1.0%)
  # OCO replace hygiene (Binance spot OCO cannot be amended: cancel + re-place).
  min_stop_improvement_pct: 0.0025
  replace_cooldown_sec: 60
  # Fail closed: block entries if positions/prices cannot be verified.
  monitor_interval_sec: 10
  monitor_stale_after_sec: 120

# Optional Stage-6 preflight hints (does not enable trading).
preflight:
  # Local Stage-5/6 host egress (must match Binance API key IP allowlist).
  expected_egress_ips:
    - 131.196.96.255
