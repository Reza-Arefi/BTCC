# E-memory walk-forward experiment — compare lookback lengths for Selector E (rank_ewma).
# Isolated research experiment. Does NOT modify live E-v1 or Adaptive V2.

selector_memory_experiment:
  enabled: true
  version: "selector_E_memory_walkforward_v1"
  experiment_id_prefix: "selector_E_memory_walkforward"

  # Entry — identical to baseline E-v1 experiment
  long_threshold: 0.60
  upper_threshold: null
  disable_late_entry_rejection: true

  weight_mode: static
  disable_weight_updates: true

  starting_capital_usd: 1000.0
  notional_usd: 100.0
  compound_portfolio: true
  max_open_opportunities: 10
  one_opportunity_per_pair: true

  # Walk-forward windows (days)
  eval_days: 365
  warmup_days: 365  # max lookback (E-365) — counterfactual history only during warmup

  btc_d_health:
    require_for_new_trades: false

  btc_d:
    enabled: false

  telegram: OFF
  allow_trading: false
  auto_live_handoff: false

  switching:
    minimum_selection_duration_hours: 6
    switch_margin: 0.0005

  # Fixed E ranking math — only lookback_days varies per arm
  ewma_half_life_days: 7

  lookbacks_days:
    E-10: 10
    E-30: 30
    E-60: 60
    E-90: 90
    E-180: 180
    E-365: 365

  # Counterfactual strategies T1–T10 (same geometry as baseline; subset of T1–T12 experiment)
  counterfactual_strategy_keys:
    - trail_1
    - trail_2
    - trail_3
    - trail_4
    - trail_5
    - trail_6
    - trail_7
    - trail_8
    - trail_9
    - trail_10

  # Strategy geometry copied from selector_experiment_config (T1–T10 only)
  strategies_source: configs/selector_experiment_config.yaml
