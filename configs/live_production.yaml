authoritative_runtime_config: binance_btc_bot/config/binance_bot.yaml

production:
  config_version: "W2_I2_T03_N2_v1"
  strategy: W2
  entry_profile: ichimoku_i2_tau
  tau: 0.03
  threshold: 0.5
  entry_rule: NEW_CROSS
  late_entry: false
  selector: null
  w2:
    stop_loss: 0.05        # 5%
    activation: 0.04       # 4%
    trail_distance: 0.02   # 2%
  portfolio:
    max_simultaneous_trades: 2
    allocation_per_trade: 0.5
  live_trading_enabled_default: false
  dry_run_default: true
  note: >
    MEXC H23 bot is a separate BTC_USD COIN-M product and is NOT this strategy.
    ALT/BTC Ichimoku W2@3% N=2 runs on Binance spot (this config).

safety:
  require_env_LIVE_TRADING_ENABLED: true
  note: >
    Real orders require ALL of: LIVE_TRADING_ENABLED=true,
    live.enabled=true, dry_run=false, and an explicit arming path
    (--live3-arm --authorize-live or --first-trade --authorize-live).
    Default construction never submits orders.

