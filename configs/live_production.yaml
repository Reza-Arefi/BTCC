authoritative_runtime_config: binance_btc_bot/config/binance_bot.yaml

production:
  config_version: "F4H_X16_S65_N6_v1"
  previous_version: "TRN4_E2_S65_N4_WKND_v1"
  strategy: F4H
  entry_profile: e2
  threshold: 0.65
  entry_rule: NEW_CROSS          # S_prev < 0.65 <= S on consecutive CLOSED 4h bars, decided once per bar
  late_entry: false
  selector: null
  signal:
    bar_interval: 4h             # ALT/BTC bars built from 1m ratio closes, UTC 00/04/08/12/16/20
    bar_source: 1m_ratio
    factor_interval: 15m         # factor lookbacks in 15m units applied to 4h bars (x16 time scale)
    lookback_bars: 400
    entry_window_min: 30         # only act within 30 min after each 4h close
  f4h:
    stop_loss: 0.25              # 25%
    take_profit: 0.30            # 30% fixed (OCO TAKE_PROFIT, no trailingDelta)
    max_hold_hours: 120          # 5 days, then cancel OCO + market sell (TIME_EXIT)
  same_symbol_cooldown_minutes: 120
  entry_blackout: null           # no weekend block
  safety_manager:
    defensive_mode: false        # -2%/-3% defensive rules are incompatible with a 25% stop
    consecutive_sl_halt: 2
  portfolio:
    max_simultaneous_trades: 6
    allocation_per_trade: 0.1666
  live_trading_enabled_default: false
  dry_run_default: true
  note: >
    MEXC H23 bot is a separate BTC_USD COIN-M product and is NOT this strategy.
    ALT/BTC E2 S>=0.65 on closed 4h bars + F4H SL25/TP30/5d, N=6 x 1/6, runs on
    Binance spot (this config).

safety:
  require_env_LIVE_TRADING_ENABLED: true
  note: >
    Real orders require ALL of: LIVE_TRADING_ENABLED=true,
    live.enabled=true, dry_run=false, and an explicit arming path
    (--live3-arm --authorize-live or --first-trade --authorize-live).
    Default construction never submits orders.

