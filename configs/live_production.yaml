  window: "2023-10 → 2026-09 (36 months, 38 ALT/BTC pairs, 1m-built 4h bars)"
  source: htf_4h/step8_3y.py   # → results/htf_4h/step8_3y/ (local)
  selection: "x16 4h score, NEW_CROSS S>=0.65, SL 25% / TP 30% / 5d hold, 6 x 1/6, 2h same-coin block"
  growth_pct_after_fees: 749.6
  max_dd_pct: -30.9
  growth_pct_with_live_gap: 521.4   # extra 0.22% per trade execution cost
  max_dd_pct_with_live_gap: -34.9
  profit_factor: 1.45
  trades: 867
  win_rate: 0.466
  positive_months: "23/36"
  caveat: "Tuned on the last 7 months; the 17 months never used in tuning returned +108% (DD -28.9%). Expect long flat/underwater stretches (longest 331 days)."
