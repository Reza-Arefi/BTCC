  regime:
    classes:
      - RANGE
      - LOW_VOL_TREND
      - NORMAL_TREND
      - STRONG_TREND
      - HIGH_VOLATILITY
    rules:
      high_vol_natr: 0.035
      range_adx: 20.0
      low_trend_adx: 30.0
      normal_trend_adx: 40.0

  analytics:
    day_axis: true
    primary_unit: cumulative_return_pct
    plots:
      - cumulative_return_all
      - drawdown_all
