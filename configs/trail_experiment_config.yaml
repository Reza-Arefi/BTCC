# Trailing-exit geometry experiment — historical only, no live bot handoff.
# Entry frozen: 0.65 <= S < 0.85, static weights, no exhaustion rejection.

trail_experiment:
  enabled: true
  version: "trail_exit_v1"
  experiment_id_prefix: "trail_compare_365d"

  # Entry band (inclusive lower, exclusive upper)
  long_threshold: 0.65
  upper_threshold: 0.85

  # Static weights only — no daily adaptation
  weight_mode: static
  disable_weight_updates: true
  disable_late_entry_rejection: true
  entry_policies: []  # single common opportunity book

  starting_capital_usd: 1000.0
  notional_usd: 100.0
  compound_portfolio: true

  max_open_opportunities: 10
  one_opportunity_per_pair: true
  total_days: 365

  benchmark_strategy_key: trail_3

  btc_d_health:
    require_for_new_trades: false

  telegram: OFF
  allow_trading: false
  auto_live_handoff: false

  strategies:
    trail_1:
      name: "T1_sl0p75_act0p75_dist0p25"
      stop_loss_pct: 0.0075
      take_profit_pct: null
      trailing:
        activation_pct: 0.0075
        distance_pct: 0.0025
